zeroslot_api_key = "{zeroslot_api_key}" # 0slot API key
zeroslot_tip_min_lamports = "{zeroslot_min_tip}" # 0slot min tip (>= 1_000_000)
zeroslot_tip_max_lamports = "{zeroslot_max_tip}" # 0slot max tip
zeroslot_min_priority_fee = "{zeroslot_min_prio}" # 0slot min priority fee
zeroslot_max_priority_fee = "{zeroslot_max_prio}" # 0slot max priority fee
zeroslot_cooldown_ms = "{zeroslot_cooldown_ms}" # 0slot loop interval in ms

falcon = false # enable Falcon sender
falcon_api_key = "{falcon_api_key}" # Falcon API key
falcon_tip_min_lamports = "{falcon_min_tip}" # Falcon min tip (>= 1_000_000)
falcon_tip_max_lamports = "{falcon_max_tip}" # Falcon max tip
falcon_min_priority_fee = "{falcon_min_prio}" # Falcon min priority fee
falcon_max_priority_fee = "{falcon_max_prio}" # Falcon max priority fee
falcon_cooldown_ms = "{falcon_cooldown_ms}" # Falcon loop interval in ms


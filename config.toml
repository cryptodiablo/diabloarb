fast_max_priority_fee = "{fast_max_prio}" # Fast max priority fee
fast_cooldown_ms = "{fast_cooldown_ms}" # Fast loop interval in ms

fast_swqos = false # enable Fast SWQOS sender
fast_swqos_api_key = "{fast_swqos_api_key}" # Fast SWQOS API key (falls back to fast_api_key)
fast_swqos_tip_min_lamports = "{fast_swqos_min_tip}" # Fast SWQOS min tip (>= 7_500)
fast_swqos_tip_max_lamports = "{fast_swqos_max_tip}" # Fast SWQOS max tip
fast_swqos_min_priority_fee = "{fast_swqos_min_prio}" # Fast SWQOS min priority fee
fast_swqos_max_priority_fee = "{fast_swqos_max_prio}" # Fast SWQOS max priority fee
fast_swqos_cooldown_ms = "{fast_swqos_cooldown_ms}" # Fast SWQOS loop interval in ms

nextblock = false # enable NextBlock sender
nextblock_api_key = "" # NextBlock API key
nextblock_tip_min_lamports = 1000000 # NextBlock min tip in lamports
nextblock_tip_max_lamports = 2000000 # NextBlock max tip in lamports
nextblock_cooldown_ms = 300 # NextBlock loop interval in ms

apex = false # enable OrbitFlare Apex sender: one send raced to the leader over staked validators, Jito and direct TPU
apex_api_key = "" # Apex API key (OrbitFlare dashboard > Apex)
apex_regions = ["fra", "ams"] # nearest Apex regions: fra ams dub lon nyc slc sgp tyo sqq (unset = all of them)

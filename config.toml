stellium_api_key = "{stellium_api_key}" # Stellium API key
# stellium_endpoints = ["http://fra1.flashrpc.com"] # optional: your Stellium endpoint URLs
stellium_tip_min_lamports = "{stellium_min_tip}" # Stellium min tip (>= 1_000_000)
stellium_tip_max_lamports = "{stellium_max_tip}" # Stellium max tip

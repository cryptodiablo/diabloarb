apex_tip_max_lamports = 2000000 # Apex max tip
apex_min_priority_fee = 100 # Apex min priority fee
apex_max_priority_fee = 500 # Apex max priority fee
apex_cooldown_ms = 300 # Apex loop interval in ms

harmonic_bundle = false # Harmonic bundles (needs a keypair whitelisted by Harmonic): only profitable ones land, a miss costs nothing
harmonic_bundle_auth_keypair = "" # path to the whitelisted keypair file
harmonic_bundle_endpoints = ["fra", "lon", "ams", "ny", "tyo", "sgp"] # regions (fra lon ams ny tyo sgp slc) or URLs
harmonic_bundle_all_endpoints = true # every endpoint each time
harmonic_bundle_cooldown_ms = 300 # Harmonic loop interval in ms

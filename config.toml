rpc = "https://read-rpc.com/" # read-only RPC for quotes/accounts (get one on diablosender.com)
keypair = "key.json" # signer keypair path
flashloan = true # use WSOL vault flashloan budget in on-chain sizing

send_rpcs = [ # broadcast RPC endpoints used by spam_rpc path
  "https://sender-rpc1.com/", # send RPC endpoint (FRA)
  "http://sender-rpc2.com/", # send RPC endpoint (AMS)
] # end send_rpcs - diablosender.com is your best choise also; they must accept transactions: new coins' token accounts are created through them

luts = "https://moneyprinter.bot/auto/mplutall.txt" # LUT list file (local path or URL)
luts_update_ms = 1000 # LUT file refresh interval in ms

markets_file = "https://moneyprinter.bot/auto/mp.toml" # markets file path (local path or URL)
files_updates_ms = 200 # local files refresh interval (gas + markets) in ms
remote_files_update_ms = 10000 # remote URL refresh interval (markets/luts) in ms

gas_file = "gas.json" # runtime vars JSON file (for {var} placeholders)
# memo = "test" # optional memo for tracing tx source

# Geyser (Yellowstone gRPC): pools update in real time; without it they are polled over rpc every second.
# Required for mode = "ladder" / "flow".
# geyser_endpoint = "https://your-geyser:443"
# geyser_x_token = "your-token"

spam_rpc = true # enable main RPC send loop

min_priority_fee = "{enable_min_prio}" # base min priority fee (lamports)
max_priority_fee = "{enable_max_prio}" # base max priority fee (lamports)
process_delay_ms = "{spam_cooldown_ms}" # RPC loop interval in ms
cu_limit = "430000" # compute-unit limit for all routes

auto_unwrap = false # auto unwrap WSOL->SOL when SOL below threshold
min_sol_amount = 0.1 # SOL threshold for auto_unwrap

# Mode: "markets" (default) shoots markets_file; "ladder" / "flow" watch the on-chain arbitrage bots over Geyser and
# shoot the coins they earn on right now (markets_file is not used then). Defaults below = what we run ourselves.
# Full explanation: USER_CONFIG.md section 8.
mode = "markets"
# The keys below act only in mode = "ladder" / "flow" (ignored in "markets").
# ladder: a coin turns on when the bots earn >= hot_sol_per_min on it; RPC copies first, senders from 2x, Jito from 4x
hot_sol_per_min = 0.03 # ladder threshold, SOL per minute the bots earn on a coin
hot_senders_x = 2 # ladder: senders join at this multiple of the threshold
hot_jito_x = 4 # ladder: Jito's own tier, only if hot_jito_as_sender = false
hot_jito_as_sender = true # Jito joins the senders' broadcast from tier 2
hot_fast_ms = 60 # ladder: extra senders' shots between ticks at tier 2+ (0 = off)
# flow: non-stop on the top coins
flow_top = 2 # flow: how many top coins
flow_rank_s = 900 # flow: ranking window, seconds
# both modes
hot_interval_ms = 250 # one shot this often (set senders' cooldowns <= this for the full pace)
hot_half_life_s = 15 # seconds a coin's temperature halves in
hot_sender_min_priority_fee = 100 # senders' priority, lamports per tx, random in range
hot_sender_max_priority_fee = 1000
hot_priority_cap = 100000 # ceiling of the RPC copies' priority (lamports per tx)
hot_lanes_off = [] # senders not used in the mode, e.g. ["nextblock"]
hot_bundle_interval_ms = 100 # bundle lanes (Temporal bundles, Harmonic, jito_classic) get the hottest route this often
# max_spend_sol = 1.0 # optional: stop once the wallet's SOL fell this much (off by default)
# nonces = 32 # durable nonces for the senders' broadcast — the hot modes use 32 by default and create them on start
#             # (~0.00145 SOL rent each; ./sender nonces close returns it). Uncomment only to change the number:
#             # set here, it is used in "markets" mode too, where nobody creates them.


jito = true # enable Jito send loop
jito_classic = false # true => sent as a bundle (bundleOnly): a bundle without profit is dropped, nothing paid
jito_require_profit = true #true = the tip is paid only if the arbitrage is successful / false = always tipping
jito_uuid = "uuid" # optional Jito UUID for higher limits ("uuid" placeholder = no UUID)
jito_min_tip_lamports = "{enable_jito_min_tip}" # Jito min tip (lamports)
jito_max_tip_lamports = "{enable_jito_max_tip}" # Jito max tip (lamports)
jito_process_delay_ms = "{jito_cooldown_ms}" # Jito loop interval in ms

helius = false # enable Helius sender (tip + priority)
helius_tip_min_lamports = "{helius_min_tip}" # Helius min tip in lamports (>= 200_000)
helius_tip_max_lamports = "{helius_max_tip}" # Helius max tip in lamports
helius_min_priority_fee = "{helius_min_prio}" # Helius min priority fee in lamports
helius_max_priority_fee = "{helius_max_prio}" # Helius max priority fee in lamports
helius_cooldown_ms = "{helius_cooldown_ms}" # Helius loop interval in ms

helius_swqos = false # enable Helius SWQOS-only sender
helius_swqos_tip_min_lamports = "{helius_swqos_min_tip}" # SWQOS min tip (>= 5_000)
helius_swqos_tip_max_lamports = "{helius_swqos_max_tip}" # SWQOS max tip
helius_swqos_min_priority_fee = "{helius_swqos_min_prio}" # SWQOS min priority fee
helius_swqos_max_priority_fee = "{helius_swqos_max_prio}" # SWQOS max priority fee
helius_swqos_cooldown_ms = "{helius_swqos_cooldown_ms}" # SWQOS loop interval in ms

temporal = false # enable Temporal/Nozomi sender
temporal_uuid = "{temporal_uuid}" # Temporal UUID (query param c=...)
temporal_tip_min_lamports = "{temporal_min_tip}" # Temporal min tip in lamports
temporal_tip_max_lamports = "{temporal_max_tip}" # Temporal max tip in lamports
temporal_min_priority_fee = "{temporal_min_prio}" # Temporal min priority fee
temporal_max_priority_fee = "{temporal_max_prio}" # Temporal max priority fee
temporal_cooldown_ms = "{temporal_cooldown_ms}" # Temporal loop interval in ms

temporal_bundle = false # Temporal bundles (sendBundle): only profitable ones land, a miss is dropped and costs nothing; uses temporal_uuid
temporal_bundle_tip_min_lamports = 1000000 # min 0.001 SOL (Temporal's minimum for bundles)
temporal_bundle_tip_max_lamports = 2000000
temporal_bundle_cooldown_ms = "{temporal_cooldown_ms}" # Temporal bundle loop interval in ms

flashblock = false # enable Flashblock sender
flashblock_api_key = "{flashblock_api_key}" # Flashblock API key
flashblock_tip_min_lamports = "{flashblock_min_tip}" # Flashblock min tip in lamports (>= 100_000)
flashblock_tip_max_lamports = "{flashblock_max_tip}" # Flashblock max tip in lamports
flashblock_min_priority_fee = "{flashblock_min_prio}" # Flashblock min priority fee
flashblock_max_priority_fee = "{flashblock_max_prio}" # Flashblock max priority fee
flashblock_cooldown_ms = "{flashblock_cooldown_ms}" # Flashblock loop interval in ms

hellomoon = false # enable HelloMoon Lunar Lander sender
hellomoon_api_key = "{hellomoon_api_key}" # HelloMoon API key (required)
hellomoon_tip_min_lamports = "{hellomoon_min_tip}" # HelloMoon min tip (>= 1_000_000)
hellomoon_tip_max_lamports = "{hellomoon_max_tip}" # HelloMoon max tip
hellomoon_min_priority_fee = "{hellomoon_min_prio}" # HelloMoon min priority fee
hellomoon_max_priority_fee = "{hellomoon_max_prio}" # HelloMoon max priority fee
hellomoon_cooldown_ms = "{hellomoon_cooldown_ms}" # HelloMoon loop interval in ms

astralane = false # enable Astralane Iris sender
astralane_api_key = "{astralane_api_key}" # Astralane API key
astralane_tip_min_lamports = "{astralane_min_tip}" # Astralane min tip (>= 10_000)
astralane_tip_max_lamports = "{astralane_max_tip}" # Astralane max tip
astralane_min_priority_fee = "{astralane_min_prio}" # Astralane min priority fee
astralane_max_priority_fee = "{astralane_max_prio}" # Astralane max priority fee
astralane_cooldown_ms = "{astralane_cooldown_ms}" # Astralane loop interval in ms

zeroslot = false # enable 0slot staked_conn sender
zeroslot_api_key = "{zeroslot_api_key}" # 0slot API key
zeroslot_tip_min_lamports = "{zeroslot_min_tip}" # 0slot min tip (>= 1_000_000)
zeroslot_tip_max_lamports = "{zeroslot_max_tip}" # 0slot max tip
zeroslot_min_priority_fee = "{zeroslot_min_prio}" # 0slot min priority fee
zeroslot_max_priority_fee = "{zeroslot_max_prio}" # 0slot max priority fee
zeroslot_cooldown_ms = "{zeroslot_cooldown_ms}" # 0slot loop interval in ms

